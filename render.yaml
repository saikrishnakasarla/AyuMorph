services:
  - type: web
    name: ayumorph-portal
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn ayumorph.wsgi:application"
    envVars:
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.11.9
