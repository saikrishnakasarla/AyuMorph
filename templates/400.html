{% extends 'base.html' %}
{% load static %}

{% block title %}Bad Request (400) – AyuMorph{% endblock %}

{% block content %}
<div class="container py-5 text-center">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="ayu-card p-5">
        <i class="bi bi-x-octagon text-danger fs-1 mb-3 d-block"></i>
        <h1 class="display-5 fw-bold text-dark mb-2">400</h1>
        <h4 class="fw-bold text-dark mb-3">Bad Request</h4>

          The request could not be processed due to invalid parameters or formatting.
        </p>
        <a href="{% url 'home' %}" class="btn btn-ayumorph">Return to Home</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
